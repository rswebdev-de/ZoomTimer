version: '3.8'

services:
  zoom-timer-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoom-timer-app
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PORT=3000
    volumes:
      - ./public:/app/public:ro
      - ./dist:/app/dist:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:3000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - zoom-timer-network

networks:
  zoom-timer-network:
    driver: bridge
