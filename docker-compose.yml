services:
  zoom-timer-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoom-timer-app
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=${NODE_ENV:-development}
      - PORT=${PORT:-3000}
      - PUBLIC_URL=${PUBLIC_URL:-}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PORT:-3000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - zoom-timer-network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: zoom-timer-ngrok
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http zoom-timer-app:${PORT:-3000} --domain=${NGROK_DOMAIN}
    ports:
      - "4040:4040"
    depends_on:
      zoom-timer-app:
        condition: service_healthy
    networks:
      - zoom-timer-network
    profiles:
      - dev

  reverse-proxy:
    image: nginx:alpine
    container_name: zoom-timer-proxy
    environment:
      - PUBLIC_URL=${PUBLIC_URL:-}
    volumes:
      - ./nginx.conf.template:/etc/nginx/templates/default.conf.template:ro
    ports:
      - "8080:80"
    depends_on:
      zoom-timer-app:
        condition: service_healthy
    networks:
      - zoom-timer-network
    profiles:
      - dev

networks:
  zoom-timer-network:
    driver: bridge
