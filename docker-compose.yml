version: '3.8'

services:
  zoom-timer-app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: zoom-timer-app
    ports:
      - "${PORT:-3000}:${PORT:-3000}"
    environment:
      - NODE_ENV=${NODE_ENV:-production}
      - PORT=${PORT:-3000}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:${PORT:-3000}/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - zoom-timer-network

  ngrok:
    image: ngrok/ngrok:latest
    container_name: zoom-timer-ngrok
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http zoom-timer-app:${PORT:-3000} --domain=${NGROK_DOMAIN}
    ports:
      - "4040:4040"
    depends_on:
      zoom-timer-app:
        condition: service_healthy
    networks:
      - zoom-timer-network

networks:
  zoom-timer-network:
    driver: bridge
