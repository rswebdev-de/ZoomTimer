server {
    listen 80;

    # Subpath: proxies /apps/timer/* to the app, stripping the prefix
    location /apps/timer/ {
        proxy_pass http://zoom-timer-app:3000/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Root: proxies everything else to the app as-is
    location / {
        proxy_pass http://zoom-timer-app:3000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
